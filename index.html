<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cyberpunk Button</title>

  <!--
    BlenderPro-Bold — the actual font from the Edgerunners site.
    Bundled in /fonts/ so this works offline.
  -->
  <style>
    @font-face {
      font-family: "BlenderProBold";
      font-style: normal;
      font-weight: 700;
      src: url("./fonts/BlenderPro-Bold.woff2") format("woff2");
    }

    /* ============================================================
       CYBERPUNK BUTTON  —  class: .cyberpunk-btn

       REUSE
         1. Keep this <style> block (or paste into your stylesheet).
         2. The class is .cyberpunk-btn — defined right here.
         3. The script (bottom of file) auto-wraps the text inside
            each .cb-text into per-character <span>s on load, so
            you just write:

              <a href="#" class="cyberpunk-btn">
                <span class="cb-text">LEARN MORE</span>
              </a>

            The .cb-text and .cb-scan spans are required.
            cb-g1 / cb-g2 are added automatically by the script.
       ============================================================ */

    :root {
      --cb-yellow: #fcee0a;
      --cb-bg:     #0c0c0c;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--cb-bg);
      font-family: "BlenderProBold", "Courier New", monospace;
      font-weight: 300;
      color: #0c0c0c;
    }

    /* ---------- The button ---------- */
    .cyberpunk-btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 246px;
      min-width: 232px;
      padding: 17px 42px 17px 37px;
      margin: 0;
      /* DEFAULT: yellow background (acts as border due to inner mask), yellow text */
      color: var(--cb-yellow);
      background: var(--cb-yellow);
      border: none;
      font-family: "BlenderProBold", "Courier New", monospace;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-decoration: none;
      cursor: pointer;
      z-index: 2;
      transition: color 120ms linear;
      clip-path: polygon(
        0 0,
        100% 0,
        100% calc(100% - 32px),
        calc(100% - 32px) 100%,
        0 100%,
        0 calc(50% + 2px),
        22px calc(50% + 2px),
        22px calc(50% - 2px),
        0 calc(50% - 2px)
      );
    }

    /* Inner background to simulate border */
    .cyberpunk-btn::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      right: 2px;
      bottom: 2px;
      background: var(--cb-bg);
      z-index: 1;
      transition: background-color 120ms linear;
      clip-path: polygon(
        0 0,
        100% 0,
        100% calc(100% - 30px),
        calc(100% - 30px) 100%,
        0 100%,
        0 calc(50% + 4px),
        22px calc(50% + 4px),
        22px calc(50% - 4px),
        0 calc(50% - 4px)
      );
    }

    .cyberpunk-btn:hover {
      color: #0c0c0c;
    }

    .cyberpunk-btn:hover::after {
      background: var(--cb-yellow);
    }
    /* Text sits above the fill */
    .cb-text, .cb-glitch { position: relative; }
    .cb-glitch { z-index: 2; }
    .cb-text { z-index: 3; }

    /* Notch is now handled by the polygon clip-path on the main element and ::after */

    /* ---------- Text stack (the .cb-text gets split per-character) ---------- */
    .cb-text {
      position: relative;
      display: inline-block;
      z-index: 3;
    }
    /* The script wraps each character in .cb-char so we can scramble
       them independently. Spaces are rendered as &nbsp; so the
       layout doesn't collapse. */
    .cb-char { display: inline-block; }

    /* The two ghost layers used for the RGB-split + slice */
    .cb-glitch {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      text-align: center;
      pointer-events: none;
      opacity: 0;
      z-index: 2;
    }
    .cb-glitch.cb-g1 { color: inherit; transform: translate(-2px, 0); }
    .cb-glitch.cb-g2 { color: inherit; transform: translate( 2px, 0); }
    .cyberpunk-btn:hover .cb-glitch.cb-g1 { animation: cb-glitch-a 280ms steps(1, end); }
    .cyberpunk-btn:hover .cb-glitch.cb-g2 { animation: cb-glitch-b 280ms steps(1, end); }

    /* ---------- Glitch keyframes for the ghost layers ---------- */
    @keyframes cb-glitch-a {
      0%   { opacity: 0; transform: translate(0,0);    clip-path: inset(0 0 0 0); }
      20%  { opacity: .9; transform: translate(-3px,0); clip-path: inset(20% 0 60% 0); }
      40%  { opacity: .9; transform: translate( 3px,0); clip-path: inset(55% 0 15% 0); }
      60%  { opacity: .9; transform: translate(-2px,0); clip-path: inset(35% 0 40% 0); }
      80%  { opacity: .9; transform: translate( 2px,0); clip-path: inset(70% 0 5%  0); }
      100% { opacity: 0; transform: translate(0,0);    clip-path: inset(0 0 0 0); }
    }
    @keyframes cb-glitch-b {
      0%   { opacity: 0; transform: translate(0,0);    clip-path: inset(0 0 0 0); }
      20%  { opacity: .9; transform: translate( 3px,0); clip-path: inset(60% 0 20% 0); }
      40%  { opacity: .9; transform: translate(-3px,0); clip-path: inset(20% 0 55% 0); }
      60%  { opacity: .9; transform: translate( 2px,0); clip-path: inset(45% 0 30% 0); }
      80%  { opacity: .9; transform: translate(-2px,0); clip-path: inset(80% 0 5%  0); }
      100% { opacity: 0; transform: translate(0,0);    clip-path: inset(0 0 0 0); }
    }

    /* Subtle scanline that sweeps across on hover */
    .cb-scan {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 4;
      overflow: hidden;
      opacity: 0;
    }
    .cb-scan::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 30%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(0,0,0,0.25), transparent);
      transform: translateX(-100%);
    }
    .cyberpunk-btn:hover .cb-scan { opacity: 1; }
    .cyberpunk-btn:hover .cb-scan::before { animation: cb-scan 500ms ease-out; }
    @keyframes cb-scan { 0% { transform: translateX(-100%); } 100% { transform: translateX(400%); } }
  </style>
</head>
<body>

  <a href="#" class="cyberpunk-btn">
    <span class="cb-text">LEARN MORE</span>
    <span class="cb-scan" aria-hidden="true"></span>
  </a>

  <!--
    ============================================================
    GLITCH SCRIPT
    ------------------------------------------------------------
    - On load: wraps each character in .cb-text with a <span>,
      and creates two ghost layers (.cb-g1, .cb-g2) with the same
      per-character structure.
    - On hover: starts a ~300ms loop that re-rolls the textContent
      of EVERY character span with random characters, then
      restores the originals. The text snaps to nonsense and back
      a few times in a few hundred milliseconds.
    - Glitch pool: A-Z, a-z, 0-9, symbols (!@#$%^&*()_+-=[]{}<>?/|).
      Same position so the "asfhk grsn" feel comes from random
      chars landing in the same slots.
    - Honors prefers-reduced-motion: glitch is disabled.
    ============================================================
  -->
  <script>
    (() => {
      const REDUCED_MOTION = window.matchMedia(
        "(prefers-reduced-motion: reduce)"
      ).matches;

      // Character pool — letters, digits, and symbols
      const POOL =
        "ABCDEFGHIJKLMNOPQRSTUVWXYZ" +
        "abcdefghijklmnopqrstuvwxyz" +
        "0123456789" +
        "!@#$%^&*()_+-=[]{}<>?/|:;~";

      // Build per-character <span>s for a given text source
      function splitText(sourceEl) {
        const text = sourceEl.textContent;
        sourceEl.textContent = "";
        // Keep an array of original chars (preserving spaces) and DOM nodes
        const chars = [];
        for (const ch of text) {
          const span = document.createElement("span");
          span.className = "cb-char";
          // Use a non-breaking space so layout doesn't collapse
          span.textContent = ch === " " ? " " : ch;
          span.dataset.original = ch;
          sourceEl.appendChild(span);
          chars.push(span);
        }
        return chars;
      }

      // Build a ghost copy of the text inside a new <span>
      function buildGhost(chars) {
        const ghost = document.createElement("span");
        ghost.className = "cb-glitch";
        ghost.setAttribute("aria-hidden", "true");
        for (let i = 0; i < chars.length; i++) {
          const span = document.createElement("span");
          span.className = "cb-char";
          span.textContent = chars[i].dataset.original === " "
            ? " "
            : chars[i].dataset.original;
          ghost.appendChild(span);
        }
        return ghost;
      }

      // Roll every span to a random character from POOL
      function scramble(charSpans) {
        for (const span of charSpans) {
          if (span.dataset.original === " ") continue; // keep spaces
          span.textContent = POOL[Math.floor(Math.random() * POOL.length)];
        }
      }

      // Restore the original text on every span
      function restore(charSpans) {
        for (const span of charSpans) {
          span.textContent = span.dataset.original === " "
            ? " "
            : span.dataset.original;
        }
      }

      document.querySelectorAll(".cyberpunk-btn").forEach((btn) => {
        const textEl = btn.querySelector(".cb-text");
        if (!textEl) return;

        const mainChars = splitText(textEl);
        const ghost1 = buildGhost(mainChars); ghost1.classList.add("cb-g1");
        const ghost2 = buildGhost(mainChars); ghost2.classList.add("cb-g2");
        // Insert the ghosts right after the main text so they stack on top
        textEl.insertAdjacentElement("afterend", ghost1);
        ghost1.insertAdjacentElement("afterend", ghost2);

        // Pre-capture the ghost spans (in document order)
        const ghost1Chars = Array.from(ghost1.querySelectorAll(".cb-char"));
        const ghost2Chars = Array.from(ghost2.querySelectorAll(".cb-char"));

        if (REDUCED_MOTION) return;

        let glitchTimer = null;
        let restoreTimer = null;

        function startGlitch() {
          // Scramble ~5 times in ~300ms, then restore.
          // 300ms / 5 frames = 60ms per frame (visible scramble duration).
          const FRAMES = 5;
          const TOTAL = 300;

          clearTimeout(glitchTimer);
          clearTimeout(restoreTimer);

          // Immediately scramble all 3 layers
          scramble(mainChars);
          scramble(ghost1Chars);
          scramble(ghost2Chars);

          // Re-roll every (TOTAL / FRAMES) ms
          let frame = 0;
          function tick() {
            frame++;
            if (frame < FRAMES) {
              scramble(mainChars);
              scramble(ghost1Chars);
              scramble(ghost2Chars);
              glitchTimer = setTimeout(tick, TOTAL / FRAMES);
            } else {
              // Final frame: restore everything
              restore(mainChars);
              restore(ghost1Chars);
              restore(ghost2Chars);
            }
          }
          glitchTimer = setTimeout(tick, TOTAL / FRAMES);
        }

        btn.addEventListener("mouseenter", startGlitch);
        // If the user moves the mouse out mid-glitch, restore cleanly
        btn.addEventListener("mouseleave", () => {
          clearTimeout(glitchTimer);
          clearTimeout(restoreTimer);
          restore(mainChars);
          restore(ghost1Chars);
          restore(ghost2Chars);
        });
      });
    })();
  </script>
</body>
</html>
